name: Promo (ролик)

# Съёмка рекламного ролика: Isle.exe --promo проходит сценарий (плашки, загрузка, панель, Клоди, снимок),
# ffmpeg пишет экран. Запись и время сцен — в ветку promo-results (монтаж — отдельно).
on:
  workflow_dispatch:
  push:
    branches: ["isle-promo*"]

permissions:
  contents: write

jobs:
  promo:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish src/Isle/Isle.csproj -c Release -r win-x64 --self-contained true -o out/app
      - name: Экран 1920×1080 и ffmpeg
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; Write-Host "1920x1080" } catch { Write-Host "разрешение не сменилось: $_" }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
      - name: Съёмка
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "promo"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Get-CimInstance Win32_VideoController | ForEach-Object { "$($_.CurrentHorizontalResolution)x$($_.CurrentVerticalResolution)" } | Tee-Object "$dir/screen.txt"
          Start-Sleep -Milliseconds 800
          $p = Start-Process -FilePath "out/app/Isle.exe" -ArgumentList "--promo", "`"$dir`"" -PassThru
          if (-not $p.WaitForExit(150000)) { Stop-Process -Id $p.Id -Force; Write-Host "таймаут" }
          Get-ChildItem $dir | ForEach-Object { Write-Host $_.Name $_.Length }
          if (Test-Path "$dir/error.txt") { Get-Content "$dir/error.txt" }
      - name: В ветку promo-results
        if: always()
        shell: pwsh
        run: |
          git config user.name "Jeredpoi"
          git config user.email "death_in_red19@mail.ru"
          git checkout --orphan promo-results
          git rm -rf --cached . | Out-Null
          New-Item -ItemType Directory -Force results | Out-Null
          Copy-Item promo/* results/ -Recurse
          git add -f results
          git commit -m "Съёмка ролика"
          git push -f origin promo-results
